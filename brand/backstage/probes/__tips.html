<!DOCTYPE html><meta charset="utf-8"><title>The slime says what it can do, seldom, and each thing once</title>
<meta name="budget" content="60000">
<iframe id="f" style="width:1000px;height:720px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// In each world the slime tells the visitor, in the first person and in a bubble
// over it, what it can do ("I can walk: the arrow keys, or WASD."). When, is
// tips.js: an area's introduction a moment after the start and a quiet spell
// apart, the rest only in a long lull, each tip once, remembered in the browser,
// so neither the next visit nor the other view says the same words again. The
// same words stand in the page, out of sight, for a screen reader.
//
// The probe forgets what was said, then in each world (the iso village, the 3D
// village, the glossary) listens to the introduction until the slime falls quiet:
// every tip new (nothing said twice, in any world), a quiet spell before each,
// three at most. It checks the 3D bubble is really drawn (white over the slime),
// opens each world again to hear nothing said twice, and sees build mode
// introduced once. The quiet spell is shortened while it listens (its real length
// is reported, and tips.test.mjs checks the pacing itself), to keep the painting short.
const say = (t) => { document.getElementById("out").textContent += "\n" + t; };
const F = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (url) => new Promise((r) => { F.onload = () => setTimeout(r, 1200); F.src = url; });
const saying = { iso: (w) => w.MH_ISO.saying(), "3D": (w) => w.MH_SLIMEVERSE3D.saying(), glossary: (w) => w.MH_GLOSSARY_WORLD.saying() };
const key = (w, type, k) => w.document.dispatchEvent(new w.KeyboardEvent(type, { key: k, bubbles: true, cancelable: true }));
const QUIET = 1.5;                                         // the probe's quiet spell, in seconds
const said = new Set();                                    // everything the slime has said, in any world
/** Wait until test() holds, up to ms; how long it took, or -1. */
async function until(test, ms) { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (test()) return Date.now() - t0; await wait(120); } return -1; }
(async () => {
  try {
    localStorage.removeItem("mh-told"); sessionStorage.clear();
    let real = null;
    for (const [name, url, tipsSel, walkKey] of [["iso", "/index.html?theme=technurture", "#mh-tips", "ArrowUp"], ["3D", "/slimeverse3d.html?theme=technurture&place=village", "#tips", "ArrowUp"], ["glossary", "/glossary.html", "#tips", "ArrowRight"]]) {
      await open(url);
      let w = F.contentWindow;
      if (!real) { real = Object.assign({}, w.MH_TIPS.timing); say("the pace: the first tip " + real.first + " s after arriving, a quiet spell of " + real.quiet + " s after each bubble, the rest after a lull of " + real.idle + " s (shortened to " + QUIET + " s here)"); }
      w.MH_TIPS.timing.quiet = QUIET;
      const now = () => saying[name](F.contentWindow);
      // the introduction, tip by tip, until the slime falls quiet
      const heard = [];
      let firstWait = await until(() => !!now(), 8000);
      if (firstWait < 0) { say(name + ": no tip at all NO"); continue; }
      const sr = (w.document.querySelector(tipsSel) || {}).textContent || "";
      say(name + ": the slime says \"" + now() + "\"" + (/^I can /.test(now()) ? "" : " NO") + "; for a screen reader: " + (sr.length > 20 ? sr.split(". ").length + " tips" : "none NO"));
      if (name === "3D") {
        await wait(1000);                                       // past its first moment, when it pops in, fading up
        const W = w.MH_SLIMEVERSE3D, E = W.engine, me = W.me; W.pause(); W.tick(0.016);
        const p = E.project([me.x, me.y + me.R * 1.15 + 1.2, me.z]), cv = E.g.canvas, k = cv.width / cv.clientWidth;
        // a column up from the bubble's tail, a little to the side of its middle (the letters are in the
        // middle), with the bubble and without it: where it is drawn the two differ
        const x = Math.round((p[0] + 14) * k), y1 = Math.round(p[1] * k), y0 = Math.max(0, Math.round((p[1] - 90) * k));
        const col = () => E.g.getImageData(x, y0, 1, y1 - y0).data;
        const withIt = col(), text = W.saying(); W.say("", 0); W.tick(0.016); const without = col(); W.say(text, 1);
        let differ = 0; for (let j = 0; j < withIt.length; j += 4) if (Math.abs(withIt[j] - without[j]) + Math.abs(withIt[j + 1] - without[j + 1]) + Math.abs(withIt[j + 2] - without[j + 2]) > 60) differ++;
        say("  its bubble over the slime: " + (differ > 10 * k ? "drawn (" + Math.round(differ / k) + " px of it in a column)" : "not there NO"));
        W.resume();
      }
      for (;;) {
        const text = now();
        heard.push(text);
        if (heard.length === 1) { key(w, "keydown", walkKey); await wait(300); key(w, "keyup", walkKey); }   // the visitor walks
        await until(() => now() !== text, 8000);                // this bubble ends
        const quietFor = await until(() => !!now(), (3.4 + QUIET + 2) * 1000);
        if (quietFor < 0) break;                                // quiet: the introduction is over
        if (quietFor < QUIET * 1000 - 400) say("  \"" + now() + "\" came " + (quietFor / 1000).toFixed(1) + " s after the last: too soon NO");
        if (heard.length > 4) break;
      }
      const again = heard.filter((h) => said.has(h)), within = heard.filter((h, i) => heard.indexOf(h) !== i);
      say("  its introduction: " + heard.length + " tip" + (heard.length === 1 ? "" : "s") + ", then quiet" + (heard.length > 3 ? " NO (wanted three at most)" : "")
        + (again.length || within.length ? "; said before NO: " + JSON.stringify(again.concat(within)) : "; none said before"));
      say("    " + heard.map((h) => JSON.stringify(h)).join(", "));
      heard.forEach((h) => said.add(h));
      // a second visit: nothing said twice
      await open(url); w = F.contentWindow; w.MH_TIPS.timing.quiet = QUIET;
      const any = await until(() => !!saying[name](F.contentWindow), (real.first + 3) * 1000);
      const second = any >= 0 ? saying[name](F.contentWindow) : "";
      say("  opened again: " + (!second ? "nothing said" : said.has(second) ? "said again NO (\"" + second + "\")" : "only something new (\"" + second + "\")"));
      if (name === "iso") {
        // build mode: introduced once, not every time it opens
        const B = () => { key(w, "keydown", "b"); key(w, "keyup", "b"); };
        B(); await wait(300);
        const b1 = saying.iso(w);
        B(); await until(() => !saying.iso(w), 6000);             // out of build mode, and its bubble gone
        B(); await wait(300);
        const b2 = saying.iso(w);
        B();
        say("  build mode: \"" + b1 + "\"" + (/^I can build/.test(b1) ? "" : " NO") + "; the second time: " + (/^I can build/.test(b2) ? "said again NO" : "not said again"));
      }
    }
    say("errors: none");
  } catch (e) { say("EXCEPTION " + e.message + "\n" + e.stack); }
  document.title = "done";
})();
</script>
