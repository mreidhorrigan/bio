<!DOCTYPE html><meta charset="utf-8"><title>The slime says what it can do, in each world</title>
<meta name="budget" content="30000">
<iframe id="f" style="width:1000px;height:720px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// In each world the slime tells the visitor, in the first person and in a bubble
// over it, what it can do ("I can walk: the arrow keys, or WASD."), one tip at a
// time, skipping what the visitor has done, once a visit; the same words stand in
// the page, out of sight, for a screen reader. The probe opens each world, reads
// the first tip, walks (so the walking tip goes), reads the next, checks the 3D
// bubble is really drawn (white over the slime), and opens the world a second time
// to see the tips are not told twice.
const say = (t) => { document.getElementById("out").textContent += "\n" + t; };
const F = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (url) => new Promise((r) => { F.onload = () => setTimeout(r, 1200); F.src = url; });
const saying = { "3D": (w) => w.MH_SLIMEVERSE3D.saying(), iso: (w) => w.MH_ISO.saying(), glossary: (w) => w.MH_GLOSSARY_WORLD.saying() };
const key = (w, type, k) => w.document.dispatchEvent(new w.KeyboardEvent(type, { key: k, bubbles: true, cancelable: true }));
(async () => {
  try {
    sessionStorage.clear();
    for (const [name, url, tipsSel] of [["3D", "/slimeverse3d.html?theme=technurture&place=village", "#tips"], ["iso", "/index.html?theme=technurture", "#mh-tips"], ["glossary", "/glossary.html", "#tips"]]) {
      await open(url);
      let w = F.contentWindow, first = "";
      for (let i = 0; i < 30 && !first; i++) { await wait(200); first = saying[name](w); }
      const sr = (w.document.querySelector(tipsSel) || {}).textContent || "";
      say(name + ": the slime says \"" + first + "\"" + (/^I can /.test(first) ? "" : " NO") + "; for a screen reader: " + (sr.length > 20 ? sr.split(". ").length + " tips" : "none NO"));
      if (name === "3D") {
        await wait(1000);                                       // past its first moment, when it pops in, fading up
        const W = w.MH_SLIMEVERSE3D, E = W.engine, me = W.me; W.pause(); W.tick(0.016);
        const p = E.project([me.x, me.y + me.R * 1.15 + 1.2, me.z]), cv = E.g.canvas, k = cv.width / cv.clientWidth;
        // a column up from the bubble's tail, a little to the side of its middle (the letters are in the
        // middle), with the bubble and without it: where it is drawn the two differ
        const x = Math.round((p[0] + 14) * k), y1 = Math.round(p[1] * k), y0 = Math.max(0, Math.round((p[1] - 90) * k));
        const col = () => E.g.getImageData(x, y0, 1, y1 - y0).data;
        const withIt = col(), text = W.saying(); W.say("", 0); W.tick(0.016); const without = col(); W.say(text, 2);
        let differ = 0; for (let j = 0; j < withIt.length; j += 4) if (Math.abs(withIt[j] - without[j]) + Math.abs(withIt[j + 1] - without[j + 1]) + Math.abs(withIt[j + 2] - without[j + 2]) > 60) differ++;
        say("  its bubble over the slime: " + (differ > 10 * k ? "drawn (" + Math.round(differ / k) + " px of it in a column)" : "not there NO"));
        W.resume();
      }
      // walk, and the walking tip is skipped: the next one told is another
      key(w, "keydown", "ArrowUp"); await wait(300); key(w, "keyup", "ArrowUp");
      let second = "";
      for (let i = 0; i < 40; i++) { await wait(200); const now = saying[name](w); if (now && now !== first) { second = now; break; } }
      say("  after a walk, the next: \"" + second + "\"" + (second && !/walk/.test(second) ? "" : " NO"));
      // a second visit: nothing told again
      await open(url); w = F.contentWindow;
      let again = ""; for (let i = 0; i < 15 && !again; i++) { await wait(200); again = saying[name](w); }
      say("  opened again: " + (again ? "told again NO (\"" + again + "\")" : "no tips, once a visit"));
    }
    say("errors: none");
  } catch (e) { say("EXCEPTION " + e.message + "\n" + e.stack); }
  document.title = "done";
})();
</script>
