<!DOCTYPE html><meta charset="utf-8"><title>A link with ?build=signal lands in build mode on the signal-tower tool</title>
<meta name="budget" content="60000">
<iframe id="f" src="/index.html?build=signal&theme=technurture&slime=30.0,30.1" style="width:1000px;height:700px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// The cover letter's link (/?build=signal): the world opens in build mode with
// "Raise a signal tower." chosen, and the word leaves the address (the theme
// stays). A click on the ground raises a tower and opens the Musebot picker;
// a reload is the plain world again. Then ?build alone (Move) and ?build=house.
// Then a click before the tower bundle has arrived: the picker still opens.
const say = (t) => { document.getElementById("out").textContent += "\n" + t; };
const F = document.getElementById("f");
let stage = 0;
const wait = (ok, then, n = 0) => { if (ok() || n > 80) then(); else setTimeout(() => wait(ok, then, n + 1), 250); };
F.addEventListener("load", () => {
  const run = [signal, reloaded, bare, house, early][stage++];
  const delay = run === early ? 0 : 1500;
  setTimeout(() => {
    try { run(); }
    catch (e) { say("EXCEPTION " + e.message + "\n" + e.stack); document.title = "done"; }
  }, delay);
});
const bar = (d) => d.getElementById("mh-buildbar");
const on = (d) => { const b = bar(d); return !!b && !b.classList.contains("mh-faded") && !b.inert; };
const current = (d) => { const c = bar(d) && bar(d).querySelector(".mh-tool.mh-cur"); return c ? c.dataset.tool : "none"; };
const param = (w, k) => new URL(w.location.href).searchParams.get(k);
const click = (w, cv, dx, dy) => {
  const r = cv.getBoundingClientRect(), x = r.left + r.width / 2 + dx, y = r.top + r.height / 2 + dy;
  for (const type of ["pointerdown", "pointerup"]) cv.dispatchEvent(new w.PointerEvent(type, { clientX: x, clientY: y, bubbles: true, pointerId: 1, pointerType: "mouse", button: 0, buttons: type === "pointerdown" ? 1 : 0, isPrimary: true }));
};
const picker = (d) => { const s = d.getElementById("mh-signal-selector"); return !!s && !s.hidden; };
function signal() {
  const w = F.contentWindow, d = w.document;
  say("?build=signal: build mode " + (on(d) ? "on" : "off NO") + "; tool " + current(d) + (current(d) === "signal" ? "" : " NO"));
  say("the address: build " + (param(w, "build") === null ? "gone" : "still there NO") + ", theme " + (param(w, "theme") || "gone NO"));
  wait(() => w.MH_MUSEBOTS, () => {
    click(w, d.querySelector("canvas"), 96, 30);
    setTimeout(() => {
      const t = w.MH_ISO.buildings().filter((b) => b.type === "signal");
      say("a click: towers " + t.length + (t.length === 1 ? "" : " NO") + "; the Musebot picker " + (picker(d) ? "open" : "closed NO"));
      w.location.reload();
    }, 600);
  });
}
function reloaded() {
  const d = F.contentWindow.document;
  say("reloaded: build mode " + (on(d) ? "on NO" : "off"));
  F.src = "/index.html?build&theme=technocute";
}
function bare() {
  const d = F.contentWindow.document;
  say("?build: build mode " + (on(d) ? "on" : "off NO") + "; tool " + current(d) + (current(d) === "move" ? "" : " NO"));
  F.src = "/index.html?build=House&theme=technocute";
}
function house() {
  const d = F.contentWindow.document;
  say("?build=House: tool " + current(d) + (current(d) === "house" ? "" : " NO"));
  F.src = "/index.html?build=signal&theme=technocute&slime=30.0,30.1";
}
function early() {
  // the frame's load event comes after the page's own, which starts the bundle's
  // fetch; a click now, as soon as the world is up, may still come before it runs
  const w = F.contentWindow, d = w.document;
  wait(() => d.querySelector("canvas") && on(d), () => {
    const before = !w.MH_MUSEBOTS;
    click(w, d.querySelector("canvas"), 96, 30);
    say("a click " + (before ? "before" : "after (the bundle was quicker)") + " the bundle: towers " + w.MH_ISO.buildings().filter((b) => b.type === "signal").length);
    wait(() => w.MH_MUSEBOTS && picker(d), () => {
      say("the bundle came: the Musebot picker " + (picker(d) ? "open" : "closed NO"));
      say("errors: none");
      document.title = "done";
    });
  }, 1);
}
</script>
