<iframe id="f" style="width:1200px;height:800px;border:0"></iframe>
<script>
const skin = (location.hash || "#technurture").slice(1);
const f = document.getElementById("f");
f.src = "/index.html?theme=" + skin;
f.addEventListener("load", () => setTimeout(() => {
  // stand the slime just in front of the Glossary's wellhead (a kiosk on the ring since
  // 2026-09-23; its chip would open the Glossary's page, in this frame)
  const I = f.contentWindow.MH_ISO, g1 = I.exhibits().find(e => e.title === "Glossary");
  if (g1) I.placePlayer(g1.tx + 1.2, g1.ty + 1.2, -1, -1);
  setTimeout(() => { document.title = "done"; }, 1800);
}, 1500));
</script>
