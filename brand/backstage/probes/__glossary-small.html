<!DOCTYPE html><meta charset="utf-8">
<iframe id="f" src="/glossary.html" style="width:390px;height:720px;border:0"></iframe>
<pre id="out">running</pre>
<script>
const log = []; const say = (k, v) => { log.push(k + ": " + v); document.getElementById("out").textContent = log.join("\n"); };
document.getElementById("f").addEventListener("load", () => setTimeout(() => {
  const w = document.getElementById("f").contentWindow, d = document.getElementById("f").contentDocument;
  try {
    const A = w.MH_GLOSSARY_WORLD, L = A.layout();
    say("hero", Math.round(d.getElementById("hero").getBoundingClientRect().height) + " of window " + w.innerHeight);
    say("world units", Math.round(L.W) + "x" + Math.round(L.H) + " at zoom " + L.zoom.toFixed(2) + ", ground " + L.BASE);
    const dock = d.getElementById("dock").getBoundingClientRect();
    say("card", Math.round(dock.width) + "x" + Math.round(dock.height) + ", bottom " + Math.round(dock.bottom));
    say("trail", d.getElementById("trail") ? "still on the page NO (archived 2026-09-24)" : "gone (archived in brand/backstage/glossary-trail-archive.md)");
    const intro = d.querySelector(".intro").getBoundingClientRect();
    say("intro", Math.round(intro.width) + "x" + Math.round(intro.height) + " at y" + Math.round(intro.top));
    say("clear", Math.round(dock.top - intro.bottom) + "px between the title and the card");
    // no horizontal scroll anywhere
    say("page width", d.documentElement.scrollWidth + " vs " + w.innerWidth + (d.documentElement.scrollWidth > w.innerWidth ? "  OVERFLOW" : "  ok"));
    // the hung boards still fit
    A.me.flying = false;
    const pen = A.marks.filter(m => m.side === "penumbra");
    for (const m of pen) { A.go(m.x); A.tick(0.016); A.tick(0.016); }
    const L2 = A.layout();
    let over = 0, tight = 1e9;
    for (const m of pen) { const gy = L2.band.bottom - m.row * L2.band.gap, top = gy - m.h * L2.scale;
      if (top < 2) over++; tight = Math.min(tight, top - (A.roofAt(m.x) + 18)); }
    say("hung boards", over + " clipped, tightest gap under the roof " + Math.round(tight) + "px");
  } catch (e) { say("EXCEPTION", e.message); }
  document.title = "done";
}, 1200));
</script>
