<!DOCTYPE html><meta charset="utf-8">
<iframe id="f" src="/glossary.html" style="width:1180px;height:860px;border:0"></iframe>
<pre id="out">running</pre>
<script>
const log = []; const say = (k, v) => { log.push(k + ": " + v); document.getElementById("out").textContent = log.join("\n"); };
const nap = ms => new Promise(r => setTimeout(r, ms));
document.getElementById("f").addEventListener("load", async () => {
  const w = document.getElementById("f").contentWindow, d = document.getElementById("f").contentDocument;
  await nap(1500);
  try {
    const A = w.MH_GLOSSARY_WORLD, G = A.ground;
    A.me.flying = false;
    const settle = (x) => { A.go(x); for (let i = 0; i < 80; i++) A.tick(0.016); };
    const fore = A.marks.filter(m => m.side === "glossary"), pen = A.marks.filter(m => m.side === "penumbra");
    say("markers", fore.length + " coinages + " + pen.length + " penumbra = " + A.marks.length);
    say("circuit", Math.round(A.width()) + "px");
    const C = A.cave();
    say("dark half", "from " + Math.round(C.entryX) + " to " + Math.round(C.exitX) + ", " + Math.round(C.exitX - C.entryX) + "px of it");
    say("darkness", "living half " + A.caveT(C.entryX - 500).toFixed(2) + " | threshold " + A.caveT(C.entryX).toFixed(2)
        + " | deep " + A.caveT((C.entryX + C.exitX) / 2).toFixed(2) + " | back out " + A.caveT(C.exitX + 500).toFixed(2));
    say("roof at the threshold", Math.round(A.roofAt(C.entryX)) + ", deep in the dark " + Math.round(A.roofAt((C.entryX + C.exitX) / 2)));
    // the roof must never come down onto a hanging sign
    for (const m of pen) { A.go(m.x); A.tick(0.016); A.tick(0.016); }   // lay every board out
    let clash = 0, tight = 1e9;
    const L0 = A.layout();
    for (const m of pen) { const gy = L0.band.bottom - m.row * L0.band.gap, top = gy - m.h * L0.scale;
      const gap = top - (A.roofAt(m.x) + 18); if (gap < 0) clash++; tight = Math.min(tight, gap); }
    say("roof vs hung signs", clash + " clashes, tightest gap " + Math.round(tight) + "px");
    say("hung sign lines", pen.map(m => (m.lines || []).length).filter(n => n > 2).length + " over two lines");
    // scenery
    say("roof", "living " + Math.round(A.roofAt(fore[3].x)) + ", dark " + Math.round(A.roofAt(pen[3].x)) + ", open at the way in " + Math.round(A.roofAt(0)));
    say("way in", "entryT(0)=" + A.entryT(0).toFixed(2) + " entryT(400)=" + A.entryT(400).toFixed(2));
    // light
    const cv = d.getElementById("crawl"), g2 = cv.getContext("2d");
    function bright() { const im = g2.getImageData(0, 0, cv.width, cv.height).data; let s = 0, n = 0; for (let i = 0; i < im.length; i += 4 * 89) { s += im[i] + im[i+1] + im[i+2]; n++; } return s / n / 3; }
    settle(fore[8].x); const day = bright();
    settle((C.entryX + C.exitX) / 2); const night = bright();
    settle(C.entryX); const mouth = bright();
    say("brightness", "in the living half " + Math.round(day) + ", at the mouth " + Math.round(mouth) + ", deep in the cave " + Math.round(night));
    // are the boards still legible in there? sample the brightest pixels near one
    settle(pen[6].x);
    const L2 = A.layout(), bx = Math.round(L2.screenX(pen[6]) * (cv.width / L2.W)), by0 = Math.round((L2.band.bottom - 60) * (cv.height / L2.H));
    const patch = g2.getImageData(Math.max(0, bx - 60), Math.max(0, by0 - 40), 120, 80).data;
    let top5 = []; for (let i = 0; i < patch.length; i += 4) top5.push((patch[i] + patch[i+1] + patch[i+2]) / 3);
    top5.sort((a, b) => b - a);
    say("the lit board", "brightest pixels around it " + Math.round(top5[0]) + ", " + Math.round(top5[50]) + ", " + Math.round(top5[400]));
    // can the buried city be made out at all? compare a band of ruins with the sky above it
    settle((C.entryX + C.exitX) / 2);
    const L3 = A.layout(), sc = cv.height / L3.H;
    function bandMean(y0, y1) { const im = g2.getImageData(0, Math.round(y0 * sc), cv.width, Math.round((y1 - y0) * sc)).data;
      let s2 = 0, n2 = 0; for (let i = 0; i < im.length; i += 4 * 37) { s2 += im[i] + im[i+1] + im[i+2]; n2++; } return s2 / n2 / 3; }
    say("silhouette", "sky band " + bandMean(60, 110).toFixed(1) + " vs ruins band " + bandMean(140, 200).toFixed(1));
    // ground still sane
    let worst = 0; for (let x = 0; x < A.width(); x += 2) worst = Math.max(worst, Math.abs(G(x + 2) - G(x)));
    say("steepest 2px step", worst.toFixed(2) + "px | seam " + G(0).toFixed(2) + " = " + G(A.width()).toFixed(2));
    say("floor at the mouths", "entry " + Math.round(G(C.entryX)) + " vs outside " + Math.round(G(C.entryX - 400))
        + ", exit " + Math.round(G(C.exitX)) + " vs beyond " + Math.round(G(C.exitX + 400)));
  } catch (e) { say("EXCEPTION", e.message + " @ " + (e.stack || "").split("\n")[1]); }
  document.title = "done";
});
</script>
