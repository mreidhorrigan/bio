<!DOCTYPE html><meta charset="utf-8"><title>Which way the houses are, in the 3D village</title>
<meta name="budget" content="30000">
<iframe id="f" src="/slimeverse3d.html?theme=technurture&place=village" style="width:1000px;height:700px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// As in the iso village: outdoors, while no house of the menu is in sight, each gets
// a numbered arrow in its colour at the edge of the frame, and the menu of houses
// shows by itself; with a house in sight, neither; in the house and the cave, neither.
const say = (t) => { document.getElementById("out").textContent += "\n" + t; };
const F = document.getElementById("f");
F.addEventListener("load", () => setTimeout(() => {
  try {
    const w = F.contentWindow, d = w.document, W = w.MH_SLIMEVERSE3D, E = W.engine, nav = d.getElementById("navbar");
    W.pause(); W.setMuted(true);
    const S = W.S(), cv = E.g.canvas, s = cv.width / E.W;
    // pixels of each house's colour along the frame's edge band (30 px in)
    const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const marks = () => {
      const cols = S.kiosks.map((q) => rgb(q.accent)), img = E.g.getImageData(0, 0, cv.width, cv.height).data, hit = new Set();
      // a marker: its colour on the band, with its white number within a few pixels
      const at = (x, y) => (Math.round(y * s) * cv.width + Math.round(x * s)) * 4;
      const white = (x, y) => { for (let dx = -7; dx <= 7; dx++) for (let dy = -7; dy <= 7; dy++) { const i = at(x + dx, y + dy); if (img[i] > 235 && img[i + 1] > 235 && img[i + 2] > 235) return true; } return false; };
      const look = (x, y) => { const i = at(x, y);
        cols.forEach((c, j) => { if (!hit.has(j) && Math.abs(img[i] - c[0]) + Math.abs(img[i + 1] - c[1]) + Math.abs(img[i + 2] - c[2]) < 30 && white(x, y)) hit.add(j); }); };
      for (let x = 10; x < E.W - 10; x += 2) { look(x, 30); look(x, E.H - 30); }
      for (let y = 10; y < E.H - 10; y += 2) { look(30, y); look(E.W - 30, y); }
      return hit.size;
    };
    const tick = (n) => { for (let i = 0; i < n; i++) W.tick(1 / 60); };
    // far out in the fields, facing away from the plaza: no house in sight
    const p = S.fromTile(30 + 14, 30 + 14);
    W.load("outdoors", { x: p[0], z: p[1], yaw: S.tileYaw(1, 1) }); tick(20);
    const a = marks();
    say("out in the fields, facing away: markers for " + a + " houses" + (a >= 4 ? "" : " NO") + "; the menu " + (nav.hidden ? "hidden NO" : "shows"));
    // at the plaza, facing a house
    W.load("outdoors", "start"); tick(20);
    const b = marks();
    say("at the plaza: markers for " + b + " houses" + (b === 0 ? "" : " NO") + "; the menu " + (nav.hidden ? "hidden" : "shows NO"));
    for (const place of ["indoors", "cave"]) {
      W.load(place, place === "cave" ? "start" : "door"); tick(20);
      const c = marks();
      say("in the " + place + ": markers for " + c + " houses" + (c === 0 ? "" : " NO") + "; the menu " + (nav.hidden ? "hidden" : "shows NO"));
    }
    // the Menu button still opens it anywhere
    d.getElementById("menu").click();
    say("the Menu button in the cave: the menu " + (nav.hidden ? "hidden NO" : "shows"));
    d.getElementById("menu").click();
    say("errors: none");
  } catch (e) { say("EXCEPTION " + e.message + "\n" + e.stack); }
  document.title = "done";
}, 2500));
</script>
