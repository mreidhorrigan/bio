<!DOCTYPE html><meta charset="utf-8"><title>The site's Slimeverse 3D page on a phone</title>
<meta name="budget" content="12000">
<iframe id="f" src="/slimeverse3d.html?theme=technurture&place=village" style="width:390px;height:800px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// A phone held upright (390 by 800). The lens must see the village, not a
// sliver of it (the slime took most of the width); the language switch must be
// a pill, not a panel the height of the screen; the place's name must be in
// the page's language.
const say = (t) => { document.getElementById("out").textContent += "\n" + t; };
document.getElementById("f").addEventListener("load", () => setTimeout(() => {
  try {
    const w = document.getElementById("f").contentWindow, W = w.MH_SLIMEVERSE3D, E = W.engine, d = w.document;
    W.pause(); for (let i = 0; i < 60; i++) W.tick(0.016);
    const across = 2 * Math.atan(E.W / 2 / E.fov) * 180 / Math.PI;
    const v = E.view([W.me.x, W.me.y + W.me.R * 0.5, W.me.z]), slimeW = 2 * W.me.R * E.fov / v[2];
    say("the lens: " + across.toFixed(0) + " degrees across" + (across >= 38 ? "" : " NO (a sliver)") + "; the slime " + (100 * slimeW / E.W).toFixed(0) + "% of the width" + (slimeW / E.W < 0.3 ? "" : " NO (too close)"));
    const pill = d.getElementById("mh-lang");
    if (pill) { const r = pill.getBoundingClientRect(); say("the language switch: " + Math.round(r.width) + " by " + Math.round(r.height) + " px, bottom at " + Math.round(r.bottom) + (r.height < 50 ? "" : " NO (stretched)")); }
    else say("the language switch: MISSING");
    // the controls, as the iso village's: Menu opens the building chips, in English on an English page
    const menu = d.getElementById("menu"), nav = d.getElementById("navbar");
    if (!menu || !nav) say("the menu: MISSING");
    else {
      menu.click();
      const chips = Array.from(nav.children).map((c) => c.textContent);
      say("the menu: " + (nav.hidden ? "stays shut NO" : chips.length + " chips: " + chips.join(", ")) + (chips.some((c) => /place|Boutique|grotte/.test(c)) ? " NO (French in English)" : ""));
      menu.click();
      const r = menu.getBoundingClientRect(), p = d.getElementById("mh-lang"), q = p && p.getBoundingClientRect();
      if (q && !(q.right < r.left || q.left > r.right || q.bottom < r.top || q.top > r.bottom)) say("the language switch covers the menu NO");
    }
    // touch, as a phone sends it: one finger turns the slime, two pinch the zoom, a tap walks
    const P = (type, id, x, y) => cv.dispatchEvent(new w.PointerEvent(type, { pointerId: id, pointerType: "touch", clientX: x, clientY: y, bubbles: true, isPrimary: id === 1 }));
    const U = (id, x, y) => w.dispatchEvent(new w.PointerEvent("pointerup", { pointerId: id, pointerType: "touch", clientX: x, clientY: y, bubbles: true }));
    const cv = d.getElementById("stage");
    let y0 = W.me.yaw;
    P("pointerdown", 1, 200, 500); for (let x = 200; x >= 80; x -= 20) { P("pointermove", 1, x, 500); W.tick(0.016); } U(1, 80, 500); W.tick(0.016);
    let turned = W.me.yaw - y0;
    say("a finger dragged 120 px sideways turns the slime " + (turned * 180 / Math.PI).toFixed(0) + " degrees" + (Math.abs(turned) > 0.5 ? "" : " NO"));
    const d0 = W.controls.dist;
    P("pointerdown", 1, 150, 400); P("pointerdown", 2, 250, 400);
    for (let k = 0; k <= 5; k++) { P("pointermove", 1, 150 - k * 12, 400); P("pointermove", 2, 250 + k * 12, 400); }
    U(2, 310, 400); U(1, 90, 400); W.tick(0.016);
    const d1 = W.controls.dist;
    say("two fingers pinched apart bring the camera from " + d0.toFixed(0) + " to " + d1.toFixed(0) + (d1 < d0 * 0.8 ? "" : " NO") + ", and the slime " + (Math.abs(W.me.yaw - y0 - turned) < 0.01 ? "did not turn" : "turned NO"));
    // a pinch as a hand makes one: the first finger drifts before the second lands, and
    // one lifts before the other, the one left moving on a little. The slime turns only by
    // that last little move (5 px, about 3 degrees), and the view does not tilt with a jump.
    const y1 = W.me.yaw, t1 = W.controls.tilt;
    P("pointerdown", 1, 150, 400); P("pointermove", 1, 158, 404); W.tick(0.016); P("pointerdown", 2, 250, 400);
    for (let k = 0; k <= 5; k++) { P("pointermove", 1, 158 - k * 10, 404 + k * 8); P("pointermove", 2, 250 + k * 12, 400 - k * 8); W.tick(0.016); }
    U(1, 108, 444); P("pointermove", 2, 315, 360); W.tick(0.016); U(2, 315, 360); W.tick(0.016);
    const dy1 = (W.me.yaw - y1) * 180 / Math.PI, dt1 = W.controls.tilt - t1;
    say("a pinch lifted one finger at a time: the slime turned " + dy1.toFixed(1) + " degrees" + (Math.abs(dy1) < 4 ? "" : " NO") + ", the view tilted " + dt1.toFixed(2) + (Math.abs(dt1) < 0.05 ? "" : " NO"));
    const d2 = W.controls.dist;
    d.getElementById("zoom-out").click(); d.getElementById("zoom-out").click();
    say("the − button twice: " + d2.toFixed(0) + " to " + W.controls.dist.toFixed(0) + (W.controls.dist > d2 * 1.4 ? "" : " NO"));
    const zd = W.controls.dist; W.load("indoors", "door"); const zi = W.controls.dist; W.load("outdoors", "home");
    say("the zoom kept through a door: " + zd.toFixed(0) + " out, " + zi.toFixed(0) + " in, " + W.controls.dist.toFixed(0) + " out again" + (Math.abs(W.controls.dist - zd) < 1 ? "" : " NO"));
    let tapped = 0; const tap0 = W.controls.onTap; W.controls.onTap = (x, y) => { tapped++; tap0(x, y); };
    P("pointerdown", 1, 195, 600); U(1, 196, 600);
    W.controls.onTap = tap0;
    say("a tap still walks: " + (tapped ? "yes" : "NO"));
    say("no sound or place-name buttons: " + (d.getElementById("sound") || d.getElementById("where") ? "one is still there NO" : "yes"));
    say("errors: none");
  } catch (e) { say("EXCEPTION " + e.message + "\n" + e.stack); }
  document.title = "done";
}, 1500));
</script>
