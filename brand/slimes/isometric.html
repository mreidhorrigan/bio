<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isometric slime — extracted live view</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; place-items: center; background: #cfe4d6; color: #1f3a1a; font: 16px/1.5 system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; }
    canvas { display: block; width: 320px; height: 240px; max-width: 90vw; margin: 1rem auto; touch-action: none; }
    a { color: #2a8186; }
    p { max-width: 34rem; }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">All slime views</a></p>
    <h1>Isometric-world slime</h1>
    <canvas id="slime" width="640" height="480" aria-label="Animated one-eyed green slime"></canvas>
    <p>It breathes while idle. Hold a pointer on the canvas, or hold an arrow/WASD key, to see its original directional walking animation.</p>
  </main>
  <script src="isometric.js"></script>
</body>
</html>
