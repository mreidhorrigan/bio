<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <title>Slimeverse 3D: M. Reid Horrigan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The village of M. Reid Horrigan's site, walkable in three dimensions: the same houses, roads and lakes as the isometric village, entered from the Slimeverse 3D house.">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <!-- English/French switch, the pair every page carries. Not deferred: a
         blocking pair this small spares a French visitor a flash of English. -->
    <script src="i18n.js"></script>
    <script src="i18n-fr.js"></script>
    <!-- engine-3d.js renders; verse3d.js is the slimeverse's runtime (the slime,
         water, creatures, ways between places); verse3d-scenes.js holds the
         places, the village read from content.js. -->
    <script src="engine-3d.js" defer="defer"></script>
    <script src="vacuole.js" defer="defer"></script>
    <script src="verse3d.js" defer="defer"></script>
    <script>window.MH_SITE = { base: "" };</script>
    <script src="content.js" defer="defer"></script>
    <script src="verse3d-scenes.js" defer="defer"></script>
    <script src="slimeverse3d-page.js" defer="defer"></script>
    <link rel="stylesheet" href="brand/brand.css">
    <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{ margin:0; font-family:var(--sans-font); color:var(--ink); background:#0d120e; overflow:hidden; }
    #stage{ position:fixed; inset:0; display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
    #stage:active{ cursor:grabbing; }
    #stage:focus-visible{ outline:3px solid var(--focus); outline-offset:-4px; }
    /* the controls, as the iso village lays them out (engine.js HUD): Menu and the
       way back bottom right, the skins bottom centre, the building chips dropping in
       at the top while Menu is on. Same pills: the leaf corner, dark glass. */
    .hud{ position:fixed; right:16px; bottom:13px; z-index:5; display:flex; gap:8px; }
    .hudbtn, .skin, .navchip{ appearance:none; cursor:pointer; line-height:1; white-space:nowrap; text-decoration:none;
      border-radius:16px 4px 16px 4px / 7px 2px 7px 2px; color:#fff; background:rgba(20,20,28,.7); border:1px solid rgba(255,255,255,.18); }
    .hudbtn{ font:700 12px var(--sans-font); padding:6px 10px; }
    .hudbtn.zoom{ min-width:34px; font-size:15px; padding:5px 10px; }     /* a thumb's width on a phone */
    .hudbtn[aria-expanded="true"], .skin[aria-pressed="true"]{ background:#fff; color:#111; border-color:#fff; }
    .switcher{ position:fixed; left:50%; bottom:52px; transform:translateX(-50%); z-index:5; display:flex; flex-wrap:wrap;
      gap:5px; justify-content:center; max-width:96vw; padding:5px; }
    .skin{ font:600 11px var(--sans-font); padding:5px 9px; background:rgba(18,18,26,.72); border-color:rgba(255,255,255,.15); }
    .navbar{ position:fixed; top:50px; left:50%; transform:translateX(-50%); z-index:6; display:flex; flex-wrap:wrap;
      gap:7px; justify-content:center; max-width:94vw; padding:7px 9px; }
    .navbar[hidden]{ display:none; }
    .navchip{ font:700 12px var(--sans-font); padding:6px 11px; background:rgba(20,20,28,.86); border-color:rgba(255,255,255,.16); }
    .hudbtn:hover, .skin:hover, .navchip:hover{ filter:brightness(1.15); }
    .hudbtn:focus-visible, .skin:focus-visible, .navchip:focus-visible{ outline:none; box-shadow:0 0 0 2px #fff; }
    .keys{ position:fixed; left:12px; top:12px; max-width:min(420px,70vw); margin:0; padding:7px 11px;
      font-size:.8rem; line-height:1.45; color:#dce6f0; background:rgba(20,20,28,.6); border-radius:16px 4px 16px 4px / 7px 2px 7px 2px; z-index:2;
      transition:opacity .6s ease; }
    .keys.gone{ opacity:0; pointer-events:none; }
    /* the card a house opens, as the iso village's does: its menu, its words, or its page */
    #card{ position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:18px; background:rgba(8,10,14,.55); }
    #card[hidden]{ display:none; }
    .card{ width:min(560px,94vw); max-height:84vh; overflow:auto; background:#fbf8f1; color:var(--ink); border:2px solid #5b2a86;
      border-radius:var(--leaf-lg); padding:18px 20px 16px; box-shadow:0 18px 50px rgba(0,0,0,.45); position:relative; }
    .card h2{ margin:0 0 10px; font-family:var(--body-font); font-variant-caps:small-caps; }
    .card .close{ position:absolute; right:10px; top:8px; border:0; background:transparent; font-size:26px; line-height:1; cursor:pointer; color:var(--ink); }
    .card .go{ display:inline-block; margin-top:6px; padding:9px 16px; background:#5b2a86; color:#fff; border-radius:var(--leaf); text-decoration:none; font-weight:700; }
    .card .toc a{ display:block; padding:7px 0; color:#5b2a86; font-weight:600; }
    @media (max-width:620px){
      .keys{ display:none; }
      .navbar{ top:40px; gap:4px; padding:4px 6px; max-width:96vw; }
      .switcher{ bottom:44px; gap:4px; padding:3px; }
      .skin{ font-size:10.5px; padding:4px 8px; }
      .hudbtn{ font-size:11px; padding:5px 8px; }
    }
  </style>
  </head>
  <body>
    <canvas id="stage" tabindex="0" role="img"
            aria-label="The village in three dimensions, seen from behind the slime: the same houses, roads and lakes as the isometric village."></canvas>
    <p class="keys">Arrow keys or W and S to walk, A and D to turn, and shift to hurry. Drag
      to look around, click to walk somewhere, and scroll or use + and − to come nearer or go farther. Walk into a house, or click it, to open
      it, as in the village. M turns the sound off and on.</p>
    <nav class="navbar" id="navbar" aria-label="Jump to a building" hidden></nav>
    <div class="switcher" role="group" aria-label="Choose a skin">
      <button type="button" class="skin" data-skin="technurture" aria-pressed="false">technurture / nth nature</button>
      <button type="button" class="skin" data-skin="technoscure" aria-pressed="false">technoscure/gloomthmaxx</button>
      <button type="button" class="skin" data-skin="technocute" aria-pressed="false">technocute/bureaucore</button>
    </div>
    <div class="hud">
      <button type="button" class="hudbtn zoom" id="zoom-in" aria-label="Nearer">+</button>
      <button type="button" class="hudbtn zoom" id="zoom-out" aria-label="Farther">−</button>
      <a class="hudbtn" id="back" href="index.html">‹ Village</a>
      <button type="button" class="hudbtn" id="menu" aria-expanded="false" aria-controls="navbar">☰ Menu</button>
    </div>
    <div id="card" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
        <button type="button" class="close" aria-label="Close">×</button>
        <h2 id="card-title"></h2>
        <div id="card-body"></div>
      </div>
    </div>
  </body>
</html>
